name: Cortex CLI Code Scan

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CORTEX_API_KEY: ${{ secrets.CORTEX_API_KEY }}
  CORTEX_API_KEY_ID: ${{ secrets.CORTEX_API_KEY_ID }}
  CORTEX_API_BASE_URL: ${{ vars.CORTEX_API_URL }}

jobs:
  cortex-code-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download cortexcli
        run: |
          set -euo pipefail
          resp=$(curl -fsS "${CORTEX_API_BASE_URL}/public_api/v1/unified-cli/releases/download-link?os=linux&architecture=amd64" \
            -H "x-xdr-auth-id: ${CORTEX_API_KEY_ID}" \
            -H "Authorization: ${CORTEX_API_KEY}")
          url=$(jq -er '.signed_url' <<< "$resp")
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsS -o "$RUNNER_TEMP/bin/cortexcli" "$url"
          chmod +x "$RUNNER_TEMP/bin/cortexcli"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/cortexcli" --version

      - name: Run Cortex CLI code scan
        env:
          REPO_ID: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          cortexcli code scan \
            --directory "$GITHUB_WORKSPACE" \
            --repo-id "$REPO_ID" \
            --branch "$BRANCH" \
            --external-checks-dir custom-appsec-rule 
